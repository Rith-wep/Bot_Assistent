  <head>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <!-- Open Graph / Telegram link previews (static tags — Telegram's crawler
         doesn't run JavaScript, so these can't be set client-side in React).
         TODO: og:image points at /og-image.png, which doesn't exist yet —
         add a real 1200x630 image before this page goes public. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="WeCare — A receptionist that never sleeps" />
    <meta
      property="og:description"
      content="Answers customers in Khmer, English, and Chinese — 24/7 — and sends every lead straight to your phone."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
